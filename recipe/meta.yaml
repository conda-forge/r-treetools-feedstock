{% set version = "2.4.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-treetools
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/TreeTools_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/TreeTools/TreeTools_{{ version }}.tar.gz
  sha256: d01401a11e8235603b9968297e89ccb99224f1a4e6bddbdbed71e1958f74bc72

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib("c") }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib("m2w64_c") }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-plottools
    - r-rcpp
    - r-rdpack >=2.6.6
    - r-ape >=5.6
    - r-bit64
    - r-fastmatch >=1.1.3
  run:
    - r-base
    - r-plottools
    - r-rcpp
    - r-rdpack >=2.6.6
    - r-ape >=5.6
    - r-bit64
    - r-fastmatch >=1.1.3

test:
  commands:
    - $R -e "library('TreeTools')"           # [not win]
    - "\"%R%\" -e \"library('TreeTools')\""  # [win]

about:
  home: https://ms609.github.io/TreeTools/
  dev_url: https://github.com/ms609/TreeTools/
  license: GPL-3.0-or-later
  summary: 'Efficient implementations of functions for the creation, modification and analysis
    of phylogenetic trees. Applications include: generation of trees with specified
    shapes; tree rearrangement; analysis of tree shape; rooting of trees and extraction
    of subtrees; calculation and depiction of split support; plotting the position of
    rogue taxa (Klopfstein & Spasojevic 2019) <doi:10.1371/journal.pone.0212942>; calculation
    of ancestor-descendant relationships, of ''stemwardness'' (Asher & Smith, 2022)
    <doi:10.1093/sysbio/syab072>, and of tree balance (Mir et al. 2013, Lemant et al.
    2022) <doi:10.1016/j.mbs.2012.10.005>, <doi:10.1093/sysbio/syac027>; artificial
    extinction (Asher & Smith, 2022) <doi:10.1093/sysbio/syab072>; import and export
    of trees from Newick, Nexus (Maddison et al. 1997) <doi:10.1093/sysbio/46.4.590>,
    and TNT <https://www.lillo.org.ar/phylogeny/tnt/> formats; and analysis of splits
    and cladistic information.'
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
